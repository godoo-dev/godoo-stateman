version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /scripts/images
    schedule:
      interval: weekly
    ignore:
      # Odoo and Postgres majors change the supported baseline; update them deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
