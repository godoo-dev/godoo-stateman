name: Disposable Odoo candidate
on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stateman-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/stateman-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.major == '19'
        with:
          name: stateman-odoo18-${{ github.sha }}
          path: ${{ runner.temp }}/stateman-candidate
      - name: Exercise the exact installed package on owned Odoo
        env:
          GODOO_ARTIFACT_DIR: ${{ runner.temp }}/stateman-candidate
          SELECTED_MAJOR: ${{ inputs.major }}
          GODOO_ENABLE_ODOO19: ${{ inputs.major == '19' && '1' || '0' }}
        run: |
          case "$SELECTED_MAJOR" in
            18) npm run check:odoo18 ;;
            19) npm run check:odoo19 ;;
            *) exit 2 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stateman-odoo${{ inputs.major }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stateman-candidate/odoo${{ inputs.major }}-result.json
            ${{ runner.temp }}/stateman-candidate/odoo${{ inputs.major }}-cleanup.json
            ${{ runner.temp }}/stateman-candidate/odoo${{ inputs.major }}-container.log
          if-no-files-found: error
