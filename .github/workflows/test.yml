---
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      # --no-sources: [tool.uv.sources] maps godoo-* to local ../godoo-py/packages/*
      # which do not exist on CI runners. All three packages are on PyPI at >=0.2.0.
      # --no-sources makes uv resolve from the index instead of local paths.
      # Note: uv sync --no-sources without --locked re-resolves the lockfile on each
      # run; this is intentional because the committed lockfile uses editable sources.
      - name: Install dependencies
        run: uv sync --no-sources
      - name: Ruff check
        run: uv run --no-sources ruff check .
      - name: Ruff format
        run: uv run --no-sources ruff format --check .
      - name: mypy
        run: uv run --no-sources mypy src/godoo_stateman

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --no-sources
      - name: Run unit tests
        run: uv run --no-sources pytest -v --cov --cov-report=xml -m "not integration"
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration:
    name: Integration Tests (Odoo ${{ matrix.odoo_version }})
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        odoo_version: ["17.0", "18.0", "19.0"]
    env:
      ODOO_VERSION: ${{ matrix.odoo_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --no-sources
      - name: Run integration tests
        run: uv run --no-sources pytest tests/acceptance -v -s -m integration --log-cli-level=ERROR
