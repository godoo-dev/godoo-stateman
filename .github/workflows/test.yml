name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      odoo19:
        type: boolean
        default: false
        description: 'Qualify19 only after this exact candidate passes18'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p "$RUNNER_TEMP/stateman-candidate"
      - run: npm run check:ci
        env:
          GODOO_ARTIFACT_DIR: ${{ runner.temp }}/stateman-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stateman-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/stateman-candidate
          if-no-files-found: error
  odoo18:
    needs: package
    uses: ./.github/workflows/odoo.yml
    with:
      major: '18'
  odoo19:
    needs: [package, odoo18]
    if: github.event_name == 'workflow_dispatch' && inputs.odoo19 == true && needs.odoo18.result == 'success'
    uses: ./.github/workflows/odoo.yml
    with:
      major: '19'
  required:
    name: required
    if: always()
    needs: [package, odoo18, odoo19]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory result and requested compatibility lane
        env:
          PACKAGE: ${{ needs.package.result }}
          ODOO18: ${{ needs.odoo18.result }}
          ODOO19: ${{ needs.odoo19.result }}
          REQUESTED19: ${{ github.event_name == 'workflow_dispatch' && inputs.odoo19 == true }}
        run: |
          test "$PACKAGE" = success
          test "$ODOO18" = success
          if [ "$REQUESTED19" = true ]; then
            test "$ODOO19" = success
          else
            test "$ODOO19" = skipped
          fi
