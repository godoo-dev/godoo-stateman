[project]
name = "godoo-stateman"
version = "0.1.0"
description = "Terraform for Odoo — declarative Odoo state reconciliation over jsonrpc"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "godoo-client>=0.2.0",
    "godoo-introspection>=0.2.0",
    "typer>=0.25.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "platformdirs>=4.9.6",
]
authors = [{ name = "Marc Fargas", email = "marc@marcfargas.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Typing :: Typed",
]

[project.scripts]
godoo-stateman = "godoo_stateman.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/godoo_stateman"]

[tool.uv.sources]
godoo-client = { path = "../godoo-py/packages/godoo", editable = true }
godoo-introspection = { path = "../godoo-py/packages/godoo-introspection", editable = true }
godoo-testcontainers = { path = "../godoo-py/packages/godoo-testcontainers", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "godoo-testcontainers>=0.2.0",
    "pytest-cov>=6",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.27",
    "python-semantic-release>=9",
    "networkx>=3.6.1",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
# TC001/TC003: project uses `from __future__ import annotations` universally;
# Typer and Pydantic introspect annotations at runtime via get_type_hints() so
# stdlib/app imports used only in annotations must remain importable at runtime.
ignore = ["TC001", "TC003"]

[tool.ruff.lint.flake8-bugbear]
# typer.Argument / typer.Option in parameter defaults is Typer's required idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker/Odoo (deselect with '-m not integration')",
]
addopts = "--tb=short -q"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}"
branch = "main"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "chore", "docs", "style", "refactor", "perf", "test", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
