[project]
name = "godoo-stateman"
version = "0.1.0"
description = "Terraform for Odoo — declarative Odoo state reconciliation over jsonrpc"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "godoo-client>=0.2.0",
    "godoo-introspection>=0.2.0",
    "typer>=0.25.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "platformdirs>=4.9.6",
]
authors = [{ name = "Marc Fargas", email = "marc@marcfargas.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Typing :: Typed",
]

[project.scripts]
godoo-stateman = "godoo_stateman.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/godoo_stateman"]

[tool.uv.sources]
godoo-client = { path = "../godoo-py/packages/godoo", editable = true }
godoo-introspection = { path = "../godoo-py/packages/godoo-introspection", editable = true }
godoo-testcontainers = { path = "../godoo-py/packages/godoo-testcontainers", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "godoo-testcontainers>=0.2.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker/Odoo (deselect with '-m not integration')",
]
addopts = "--tb=short -q"
